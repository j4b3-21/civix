# TLS-terminating reverse proxy for single-host deployments (docker compose --profile proxy).
# Place fullchain.pem / privkey.pem in infrastructure/nginx/certs (e.g. from certbot). Only the web app is proxied;
# the API is reached through the web app's same-origin /api/v1 rewrite, and internal services are never exposed.

server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:civix:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 11m;   # 10 MB documents + multipart overhead

    # Block internal paths even if something upstream misroutes them.
    location ~ ^/(internal|actuator)/ { return 404; }
    location ~ ^/api/v1/internal/ { return 404; }

    # Server-Sent Events: no buffering, long read timeout.
    location ~ ^/api/v1/agent/tasks/[^/]+/events$ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
