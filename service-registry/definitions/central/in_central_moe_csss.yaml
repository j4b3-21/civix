schemaVersion: "1.0"
code: IN_CENTRAL_MOE_CSSS
version: 1
name: Central Sector Scheme of Scholarship for College and University Students (PM-USP CSSS)
summary: Merit scholarship for students above the 80th percentile in Class XII, pursuing regular degree courses, with family income up to ₹4.5 lakh a year.
description: >
  A component of the Pradhan Mantri Uchchatar Shiksha Protsahan (PM-USP) Yojana of the Department of Higher Education.
  It provides financial assistance to meritorious students from families with limited income to meet part of their day-to-day
  expenses during higher studies. Applications are made online on the National Scholarships Portal (NSP).
department: Department of Higher Education
ministry: Ministry of Education
category: SCHOLARSHIPS
tags: [merit, undergraduate, postgraduate, nsp, income-based]
jurisdiction: {level: CENTRAL, states: []}
officialUrl: https://scholarships.gov.in
portalDomains: [scholarships.gov.in]
verificationStatus: SOURCE_VERIFIED
verificationNote: >
  Rules checked on 2026-11-01 against the PM-USP CSSS guidelines "applicable for academic year 2022-23 onwards"
  (copy hosted by NIT Kurukshetra). Re-check the current-year NSP notice before relying on figures.
automationStatus: GUIDED
automationNote: >
  Applications must be filed on NSP, which requires One-Time Registration with Aadhaar-based authentication.
  CIVIX has no authorization to automate NSP; it prepares your eligibility check, document checklist and the values to enter.
isTestService: false
lastVerifiedAt: 2026-11-01
deadline: null
benefits:
  - "₹12,000 per year at graduation level (first three years of college/university courses)."
  - "₹20,000 per year at post-graduation level."
  - "₹20,000 per year in the 4th and 5th year of professional/integrated courses; B.Tech/B.Engg. ₹12,000 (years 1–3) and ₹20,000 (year 4)."
  - "Up to 82,000 fresh scholarships per year; 50% earmarked for girls."
sources:
  - id: csss_guidelines
    url: https://nitkkr.ac.in/wp-content/uploads/2025/04/Central-Sector-Scheme-Of-Scholarships-For-College-And-University-Students.pdf
    title: "PM-USP — Guidelines for the component scheme CSSS (applicable for academic year 2022-23 onwards)"
    kind: GUIDELINES
    retrievedAt: 2026-11-01
    publisher: Ministry of Education (copy hosted by NIT Kurukshetra)
  - id: moe_scheme_page
    url: https://education.gov.in/node/255
    title: "Ministry of Education — Central Sector Scheme of Scholarship for College and University Students"
    kind: OFFICIAL_PORTAL
    retrievedAt: 2026-11-01
    publisher: Ministry of Education
    note: Page is script-rendered; content reviewed via search index excerpt only.
  - id: nsp_portal
    url: https://scholarships.gov.in
    title: National Scholarships Portal
    kind: OFFICIAL_PORTAL
    retrievedAt: 2026-11-01
    note: Named in the guidelines as the only application channel. Not reachable from the CIVIX build environment.
eligibility:
  rules:
    - id: class12_above_80th_percentile
      version: 1
      field: class12_board_percentile
      operator: GREATER_THAN
      value: 80
      description: Above the 80th percentile of successful candidates in the relevant stream of your Class XII board.
      sourceId: csss_guidelines
      excerpt: "above 80th percentile of successful candidates in the relevant stream"
    - id: regular_degree_course
      version: 1
      field: course_type
      operator: EQUALS
      value: REGULAR
      description: Must be pursuing a regular course (not correspondence or distance mode).
      sourceId: csss_guidelines
    - id: degree_level
      version: 1
      field: education_level
      operator: IN
      value: [UNDERGRADUATE, POSTGRADUATE]
      description: Covers degree (graduate and post-graduate) courses; diploma courses are not covered.
      sourceId: csss_guidelines
    - id: family_income_limit
      version: 1
      field: annual_family_income
      operator: LESS_THAN_OR_EQUAL
      value: 450000
      description: Gross parental/family income up to ₹4.5 lakh per annum.
      sourceId: csss_guidelines
      excerpt: "gross parental/family income upto Rs. 4.5 lakh per annum"
    - id: no_other_scholarship
      version: 1
      field: receiving_other_scholarship
      operator: EQUALS
      value: false
      description: Must not be availing any other scholarship, including state schemes and fee waiver/reimbursement schemes.
      sourceId: csss_guidelines
  notEvaluated:
    - The college/institution must be recognised by AICTE and the relevant regulatory body (checked by the institute during verification).
    - "Renewal requires at least 50% marks in the annual examination and at least 75% attendance."
requiredDocuments:
  - {category: ACADEMIC_RECORD, description: Class XII marksheet, mandatory: true}
  - {category: INCOME_CERTIFICATE, description: Family income certificate (fresh applicants only), mandatory: true}
  - {category: IDENTITY_PROOF, description: Aadhaar (used for NSP One-Time Registration and DBT), mandatory: true}
  - {category: BANK_DOCUMENT, description: Savings bank account in the student's own name for DBT, mandatory: true}
  - {category: CASTE_CERTIFICATE, description: "Category certificate, if applying under a reserved category", mandatory: false, condition: "social_category in [SC, ST, OBC, EWS]"}
procedure:
  - {order: 1, title: One-Time Registration, description: Complete One-Time Registration (OTR) on the National Scholarships Portal.}
  - {order: 2, title: Apply, description: "Sign in with your OTR ID, choose the Central Sector Scheme of Scholarship and fill course, institution and income details."}
  - {order: 3, title: Upload documents, description: Upload the documents the portal asks for (income certificate for fresh applicants).}
  - {order: 4, title: Verification, description: The institute and then the state/board nodal officers verify the application.}
  - {order: 5, title: Payment, description: Scholarship is paid by Direct Benefit Transfer to the student's bank account.}
workflow: null
