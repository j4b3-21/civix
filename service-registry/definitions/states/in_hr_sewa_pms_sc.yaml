name: Haryana — Post Matric Scholarship Scheme for SC Students
summary: Haryana's implementation of the post-matric scholarship for Scheduled Caste students domiciled in Haryana, family income below ₹2.5 lakh.
description: >
  Scheduled Caste students of Haryana studying in post-matric classes receive a monthly scholarship and reimbursement of
  compulsory non-refundable fees, under the Government of India Post Matric Scholarship Scheme as implemented by the
  Social Justice, Empowerment, Welfare of Scheduled Castes and Backward Classes and Antyodaya (SEWA) Department.
department: Social Justice, Empowerment, Welfare of SCs & BCs and Antyodaya (SEWA) Department, Haryana
