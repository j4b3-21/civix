# CIVIX local stack.   docker compose up -d --build
# Only the web app is published (127.0.0.1:3000). Everything else lives on internal networks.
# The test portal is started only with the "test" profile:  docker compose --profile test up -d --build

name: civix

x-restart: &restart
  restart: unless-stopped

networks:
  edge: {}                        # browser ↔ web
  backend:
    internal: true                # no route to the internet: web/api/agent/data stores
  browser-egress: {}              # browser-worker only: reaches approved portals (allowlist enforced in-process)
  agent-egress: {}                # agent only: optional LLM provider and official-source fetches

volumes:
  postgres-data: {}
  redis-data: {}
  storage-data: {}
  ollama-data: {}

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civix}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      CIVIX_DB_PASSWORD: ${CIVIX_DB_PASSWORD:?set CIVIX_DB_PASSWORD}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {memory: 1g}

  redis:
    <<: *restart
    image: redis:7.4.6-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: {memory: 256m}

  storage:
    <<: *restart
    image: coollabsio/minio:latest@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?set MINIO_KMS_SECRET_KEY}   # enables SSE-S3 encryption at rest
      MINIO_BROWSER: "off"
    volumes:
      - storage-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: {memory: 512m}

  api:
    <<: *restart
    build:
      context: apps/api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CIVIX_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civix}
      CIVIX_DB_USER: civix_api
      AGENT_INTERNAL_URL: http://agent:8000
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      REDIS_HOST: redis
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage: {condition: service_healthy}
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/liveness >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    deploy:
      resources:
        limits: {memory: 1g}

  agent:
    <<: *restart
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    env_file: .env
    environment:
      AGENT_DATABASE_URL: postgresql://civix_agent:${AGENT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-civix}
      API_INTERNAL_URL: http://api:8080
      BROWSER_WORKER_URL: http://browser-worker:8001
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SERVICE_REGISTRY_PATH: /app/service-registry
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-http://ollama:11434/v1}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-qwen2.5:0.5b}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      DATA_GOV_API_KEY: ${DATA_GOV_API_KEY:-}
      DATA_GOV_BASE_URL: ${DATA_GOV_BASE_URL:-https://api.data.gov.in}
    depends_on:
      postgres: {condition: service_healthy}
      storage: {condition: service_healthy}
      browser-worker: {condition: service_healthy}
      ollama: {condition: service_started}
    networks: [backend, agent-egress]
    deploy:
      resources:
        limits: {memory: 1g}

  ollama:
    <<: *restart
    image: ollama/ollama:0.12.6
    volumes:
      - ollama-data:/root/.ollama
    networks: [agent-egress]
    expose: ["11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: {memory: 2g}

  browser-worker:
    <<: *restart
    build:
      context: .
      dockerfile: apps/agent/Dockerfile.browser
    environment:
      CIVIX_ENV: ${CIVIX_ENV:-local}
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:?set BROWSER_WORKER_TOKEN}
      APPROVAL_SIGNING_SECRET: ${APPROVAL_SIGNING_SECRET:?set APPROVAL_SIGNING_SECRET}
      BROWSER_HEADLESS: "true"
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-4}
      BROWSER_SESSION_IDLE_TIMEOUT_SECONDS: ${BROWSER_SESSION_IDLE_TIMEOUT_SECONDS:-900}
      BROWSER_PRIVATE_HOST_ALLOWLIST: ${BROWSER_PRIVATE_HOST_ALLOWLIST:-}
      HOME: /tmp
    networks: [backend, browser-egress]
    shm_size: 1gb
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: {memory: 2g, cpus: "2.0"}

  web:
    <<: *restart
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8080
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: {condition: service_healthy}
    networks: [edge, backend]
    deploy:
      resources:
        limits: {memory: 512m}

  # Authorized local test environment (NOT a government site). Only with: --profile test
  test-portal:
    profiles: ["test"]
    <<: *restart
    build:
      context: .
      dockerfile: infrastructure/test-portal/Dockerfile
    networks: [browser-egress]

  # One-shot Flyway runner (make migrate). The API also migrates on startup with the same scripts.
  flyway:
    profiles: ["tools"]
    image: flyway/flyway:11.14.1-alpine
    command: ["-url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civix}", "-user=civix_api", "-password=${CIVIX_DB_PASSWORD}",
              "-schemas=civix", "-defaultSchema=civix", "-connectRetries=10", "migrate"]
    volumes:
      - ./apps/api/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]

  # Optional TLS-terminating reverse proxy for single-host deployments. Only with: --profile proxy
  nginx:
    profiles: ["proxy"]
    <<: *restart
    image: nginx:1.28.0-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/nginx/civix.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web: {condition: service_started}
    networks: [edge]
